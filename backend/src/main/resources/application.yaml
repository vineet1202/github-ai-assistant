spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/devpilot}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
      embedding:
        options:
          model: text-embedding-3-small

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - read:user
              - repo
			user-name-attribute: id
			
server:
  servlet:
   session:
	cookie:
		name: DEVPILOT_SESSION
		http_only: true
		same-site: lax
	timeout: 7d

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  cors:
	allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  token-encryptor-: ${TOKEN_ENCRYPTOR_PASSWORD:devpilot-local-encrypt-key-change-me}
  token-encryptor-salt: ${TOKEN_ENCRYTPOR_SALT:wmvpmdfyff}
  indexing:
	max-file-bytes: 102400
	chunk-size: 800
	chunk-overlap: 100
  github:
	api-delay-ms: 50
